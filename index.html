<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VisionOS Live TV — macOS Studio Edition</title>
  <!-- Shaka Player for MPEG-DASH (.mpd) & ClearKey DRM -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --glass-bg: rgba(24, 24, 29, 0.62);
      --glass-panel: rgba(34, 34, 42, 0.55);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-highlight: rgba(255, 255, 255, 0.07);
      --accent: #0A84FF;
      --accent-glow: rgba(10, 132, 255, 0.45);
      --text-primary: #F5F5F7;
      --text-secondary: rgba(235, 235, 245, 0.6);
      --danger: #FF453A;
      --warning: #FF9F0A;
      --success: #30D158;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      background: #050508;
      color: var(--text-primary);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Dynamic macOS Sonoma Mesh Wallpaper */
    .ambient-wallpaper {
      position: fixed;
      inset: -20%;
      z-index: 0;
      background: 
        radial-gradient(circle at 18% 22%, rgba(10, 132, 255, 0.38) 0%, transparent 45%),
        radial-gradient(circle at 82% 28%, rgba(191, 90, 242, 0.32) 0%, transparent 50%),
        radial-gradient(circle at 48% 82%, rgba(48, 209, 88, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 85% 85%, rgba(255, 55, 95, 0.25) 0%, transparent 45%),
        #07070c;
      filter: blur(60px);
      animation: ambientShift 24s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes ambientShift {
      0% { transform: scale(1) rotate(0deg); }
      100% { transform: scale(1.08) rotate(3deg); }
    }

    /* macOS Top Menu Bar */
    .menubar {
      position: relative;
      z-index: 10;
      height: 32px;
      background: rgba(15, 15, 20, 0.55);
      backdrop-filter: blur(30px) saturate(190%);
      -webkit-backdrop-filter: blur(30px) saturate(190%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .menubar-left, .menubar-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .apple-logo {
      font-size: 15px;
      opacity: 0.95;
    }

    .menubar-app-name {
      font-weight: 700;
    }

    .menubar-item {
      color: var(--text-secondary);
      cursor: default;
      transition: color 0.15s;
    }

    .menubar-item:hover {
      color: var(--text-primary);
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(48, 209, 88, 0.16);
      border: 1px solid rgba(48, 209, 88, 0.4);
      color: #30D158;
      padding: 2px 9px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: #30D158;
      border-radius: 50%;
      box-shadow: 0 0 8px #30D158;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* Main Workspace Container */
    .workspace {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      padding: 18px 22px 22px;
      gap: 18px;
      overflow: hidden;
    }

    /* Main macOS Window */
    .mac-window {
      flex: 1;
      display: flex;
      background: var(--glass-bg);
      backdrop-filter: blur(45px) saturate(200%);
      -webkit-backdrop-filter: blur(45px) saturate(200%);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: 
        0 30px 70px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
      overflow: hidden;
    }

    /* Left Sidebar (Channel Navigator) */
    .sidebar {
      width: 320px;
      min-width: 320px;
      background: rgba(18, 18, 24, 0.45);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .window-controls {
      padding: 18px 20px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .traffic-lights {
      display: flex;
      gap: 8px;
    }

    .light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      position: relative;
      cursor: pointer;
      border: 0.5px solid rgba(0, 0, 0, 0.25);
    }

    .light.close { background: var(--danger); }
    .light.minimize { background: var(--warning); }
    .light.maximize { background: var(--success); }

    .sidebar-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.06);
      padding: 3px 9px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .search-box {
      margin: 0 16px 12px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: rgba(0, 0, 0, 0.32);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 9px 12px 9px 34px;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
      background: rgba(0, 0, 0, 0.5);
    }

    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--text-secondary);
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
      padding: 0 16px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    .tab-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .channel-list::-webkit-scrollbar {
      width: 5px;
    }

    .channel-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 10px;
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 11px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.18s ease;
      position: relative;
    }

    .channel-item:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .channel-item.active {
      background: linear-gradient(135deg, rgba(10, 132, 255, 0.28), rgba(10, 132, 255, 0.1));
      border-color: rgba(10, 132, 255, 0.55);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
    }

    .ch-logo-wrap {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    .ch-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 4px;
    }

    .ch-fallback {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #fff;
      text-transform: uppercase;
    }

    .ch-meta {
      flex: 1;
      min-width: 0;
    }

    .ch-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ch-sub {
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .ch-num {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.35);
      font-variant-numeric: tabular-nums;
    }

    .fav-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.28);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: all 0.15s;
    }

    .fav-btn:hover {
      color: #FFD60A;
      background: rgba(255, 255, 255, 0.08);
    }

    .fav-btn.favorited {
      color: #FFD60A;
    }

    /* Right Stage: Video Player & Glass HUD */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(8, 8, 12, 0.55);
      position: relative;
      overflow: hidden;
    }

    /* Top Stage Header */
    .stage-header {
      height: 64px;
      padding: 0 24px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.02);
    }

    .now-playing-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .active-ch-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .active-ch-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .stream-tag {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #64D2FF;
    }

    .stage-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .glass-pill-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text-primary);
      padding: 7px 13px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s;
    }

    .glass-pill-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.24);
    }

    .glass-pill-btn.active-mode {
      background: rgba(10, 132, 255, 0.22);
      border-color: var(--accent);
      color: #64D2FF;
    }

    /* Video Viewport */
    .player-viewport {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Loading & Error Glass Overlay */
    .status-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 16, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 4;
      padding: 28px;
      text-align: center;
      transition: opacity 0.25s ease;
    }

    .status-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.14);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-title {
      font-size: 16px;
      font-weight: 600;
    }

    .status-desc {
      font-size: 13px;
      color: var(--text-secondary);
      max-width: 460px;
      line-height: 1.5;
    }

    .error-actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Floating macOS Quick-Controls Dock */
    .floating-dock {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      background: rgba(28, 28, 36, 0.68);
      backdrop-filter: blur(30px) saturate(190%);
      -webkit-backdrop-filter: blur(30px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
      transition: opacity 0.3s, transform 0.3s;
    }

    .dock-btn {
      background: transparent;
      border: none;
      color: var(--text-primary);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    .dock-divider {
      width: 1px;
      height: 22px;
      background: rgba(255, 255, 255, 0.12);
    }

    .volume-slider {
      width: 88px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Responsive Mobile Layout */
    @media (max-width: 900px) {
      .workspace { padding: 8px; }
      .mac-window { flex-direction: column-reverse; }
      .sidebar { width: 100%; min-width: unset; height: 44%; border-right: none; border-top: 1px solid var(--glass-border); }
      .stage { height: 56%; }
      .floating-dock { bottom: 10px; padding: 6px 12px; }
    }
  </style>
</head>
<body>

  <!-- Dynamic macOS Sonoma Background -->
  <div class="ambient-wallpaper"></div>

  <!-- macOS Menu Bar -->
  <header class="menubar">
    <div class="menubar-left">
      <span class="apple-logo"></span>
      <span class="menubar-app-name">VisionTV Studio</span>
      <span class="menubar-item">File</span>
      <span class="menubar-item">Channels</span>
      <span class="menubar-item">Stream</span>
      <span class="menubar-item">Window</span>
    </div>
    <div class="menubar-right">
      <div class="live-pill">
        <span class="live-dot"></span>
        <span>MPEG-DASH ENGINE</span>
      </div>
      <span id="clock" class="menubar-item" style="color: var(--text-primary); font-weight: 600;">--:--</span>
    </div>
  </header>

  <!-- Main Desktop Workspace -->
  <main class="workspace">
    <div class="mac-window" id="macWindow">
      
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="window-controls">
          <div class="traffic-lights">
            <div class="light close" title="Reset Player" onclick="reloadCurrentChannel()"></div>
            <div class="light minimize" title="Toggle Sidebar" onclick="toggleSidebar()"></div>
            <div class="light maximize" title="Fullscreen" onclick="toggleFullscreen()"></div>
          </div>
          <span class="sidebar-badge" id="channelCount">25 CHANNELS</span>
        </div>

        <div class="search-box">
          <i data-lucide="search" class="search-icon"></i>
          <input type="text" id="searchInput" placeholder="Search channels (e.g. GMA, TV5, ANC)..." autocomplete="off" />
        </div>

        <div class="filter-tabs">
          <button class="tab-btn active" id="tabAll" onclick="setFilter('all')">
            <i data-lucide="tv" style="width:14px;height:14px;"></i> All Live
          </button>
          <button class="tab-btn" id="tabFav" onclick="setFilter('fav')">
            <i data-lucide="star" style="width:14px;height:14px;"></i> Favorites
          </button>
        </div>

        <div class="channel-list" id="channelList"></div>
      </aside>

      <!-- Main Video Stage -->
      <section class="stage">
        <div class="stage-header">
          <div class="now-playing-info">
            <div class="ch-logo-wrap" id="headerLogo">
              <span class="ch-fallback">TV</span>
            </div>
            <div>
              <div class="active-ch-title" id="activeChannelName">Select a Channel</div>
              <div class="active-ch-subtitle">
                <span class="stream-tag">DASH .MPD</span>
                <span id="streamStatusText">Ready to stream</span>
              </div>
            </div>
          </div>

          <div class="stage-actions">
            <button class="glass-pill-btn" id="proxyToggleBtn" onclick="toggleProxyMode()" title="Switch between Cloudflare HTTPS Proxy and Direct HTTP Stream">
              <i data-lucide="shield-check" style="width:15px;height:15px;"></i>
              <span id="proxyModeLabel">Mode: Direct</span>
            </button>
            <button class="glass-pill-btn" onclick="copyStreamUrl()" title="Copy raw MPD URL">
              <i data-lucide="copy" style="width:15px;height:15px;"></i>
              <span>Copy URL</span>
            </button>
          </div>
        </div>

        <div class="player-viewport" id="playerViewport">
          <video id="videoPlayer" autoplay playsinline></video>

          <!-- Loading / Mixed-Content Diagnostic Overlay -->
          <div class="status-overlay hidden" id="statusOverlay">
            <div class="spinner" id="statusSpinner"></div>
            <div class="status-title" id="statusTitle">Connecting to Stream...</div>
            <div class="status-desc" id="statusDesc">Negotiating MPEG-DASH manifest and initializing media buffers.</div>
            <div class="error-actions" id="errorActions" style="display: none;">
              <button class="glass-pill-btn active-mode" onclick="switchToProxyAndRetry()">
                <i data-lucide="cloud-lightning" style="width:15px;height:15px;"></i> Use Cloudflare Proxy
              </button>
              <button class="glass-pill-btn" onclick="reloadCurrentChannel()">
                <i data-lucide="refresh-cw" style="width:15px;height:15px;"></i> Retry Stream
              </button>
            </div>
          </div>

          <!-- macOS Floating Control Dock -->
          <div class="floating-dock">
            <button class="dock-btn" onclick="stepChannel(-1)" title="Previous Channel (Up Arrow)">
              <i data-lucide="skip-back" style="width:18px;height:18px;"></i>
            </button>
            <button class="dock-btn" id="playPauseBtn" onclick="togglePlay()" title="Play / Pause (Space)">
              <i data-lucide="pause" style="width:18px;height:18px;"></i>
            </button>
            <button class="dock-btn" onclick="stepChannel(1)" title="Next Channel (Down Arrow)">
              <i data-lucide="skip-forward" style="width:18px;height:18px;"></i>
            </button>

            <div class="dock-divider"></div>

            <button class="dock-btn" id="muteBtn" onclick="toggleMute()" title="Mute / Unmute (M)">
              <i data-lucide="volume-2" style="width:18px;height:18px;"></i>
            </button>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)" />

            <div class="dock-divider"></div>

            <button class="dock-btn" onclick="togglePiP()" title="Picture-in-Picture">
              <i data-lucide="picture-in-picture-2" style="width:18px;height:18px;"></i>
            </button>
            <button class="dock-btn" onclick="toggleFullscreen()" title="Fullscreen (F)">
              <i data-lucide="maximize-2" style="width:18px;height:18px;"></i>
            </button>
          </div>
        </div>
      </section>

    </div>
  </main>

      { name: "Cinema One", url: "http://136.239.158.10:6610/001/2/ch00000090990000001283/manifest.mpd?AuthInfo=v87HD9rEhwHiAdYyrP20TsXah2%2FZLFNNIdWrVrXDMAr2cQyuTRlDkHeiqeVidUqqsyK4TH4mOENKJ45mwOyS0g%3D%3D&version=v1.0&BreakPoint=0&virtualDomain=001.live_hls.zte.com&programid=ch00000000000000001548&contentid=ch00000000000000001548&videoid=ch00000090990000001283&recommendtype=0&userid=1481102669463&boid=001&stbid=02%3A00%3A00%3A00%3A00%3A00&terminalflag=1&profilecode=&usersessionid=7TIMXILHNX5XXX&NeedJITP=1&JITPMediaType=DASH&JITPDRMType=NO&IASHttpSessionId=RR20445520260101155240041967&ispcode=55", key: "", logo: "cinemaone.png", category: "LIVE TV CHANNELS" }
    ];

    let shakaPlayer = null;
    let currentIndex = 0;
    let currentFilter = 'all';
    let useCloudflareProxy = window.location.protocol === 'https:';
    let favorites = JSON.parse(localStorage.getItem('visiontv_favs') || '[]');

    const videoEl = document.getElementById('videoPlayer');
    const channelListEl = document.getElementById('channelList');
    const searchInput = document.getElementById('searchInput');
    const statusOverlay = document.getElementById('statusOverlay');
    const statusTitle = document.getElementById('statusTitle');
    const statusDesc = document.getElementById('statusDesc');
    const statusSpinner = document.getElementById('statusSpinner');
    const errorActions = document.getElementById('errorActions');

    // Initialize App
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      updateClock();
      setInterval(updateClock, 10000);
      updateProxyUI();

      shaka.polyfill.installAll();
      if (shaka.Player.isBrowserSupported()) {
        shakaPlayer = new shaka.Player(videoEl);
        shakaPlayer.configure({
          streaming: {
            bufferingGoal: 12,
            rebufferingGoal: 2,
            lowLatencyMode: true,
            retryParameters: { maxAttempts: 3, baseDelay: 800 }
          }
        });

        // Intercept segment requests when Cloudflare Proxy mode is enabled
        shakaPlayer.getNetworkingEngine().registerRequestFilter((type, request) => {
          if (useCloudflareProxy) {
            request.uris = request.uris.map(uri => {
              if (uri.startsWith(window.location.origin + '/proxy')) return uri;
              return `${window.location.origin}/proxy?url=${encodeURIComponent(uri)}`;
            });
          }
        });

        shakaPlayer.addEventListener('error', onPlayerError);
      }

      renderChannels();
      loadChannel(0);

      searchInput.addEventListener('input', renderChannels);
    });

    function getInitials(name) {
      return name.replace(/[^a-zA-Z0-9 ]/g, '').split(' ').map(w => w[0]).join('').substring(0, 3);
    }

    function renderChannels() {
      const query = searchInput.value.toLowerCase().trim();
      channelListEl.innerHTML = '';

      const filtered = CHANNELS.map((ch, idx) => ({ ...ch, index: idx })).filter(ch => {
        const matchesQuery = ch.name.toLowerCase().includes(query);
        const matchesFav = currentFilter === 'fav' ? favorites.includes(ch.name) : true;
        return matchesQuery && matchesFav;
      });

      document.getElementById('channelCount').textContent = `${filtered.length} CHANNELS`;

      filtered.forEach(ch => {
        const isFav = favorites.includes(ch.name);
        const item = document.createElement('div');
        item.className = `channel-item ${ch.index === currentIndex ? 'active' : ''}`;
        item.onclick = () => loadChannel(ch.index);

        item.innerHTML = `
          <div class="ch-logo-wrap">
            <img src="logos/${ch.logo}" alt="${ch.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
            <span class="ch-fallback" style="display:none;">${getInitials(ch.name)}</span>
          </div>
          <div class="ch-meta">
            <div class="ch-name">${ch.name}</div>
            <div class="ch-sub">
              <span class="ch-num">CH ${String(ch.index + 1).padStart(2, '0')}</span>
              <span>•</span>
              <span>MPEG-DASH</span>
            </div>
          </div>
          <button class="fav-btn ${isFav ? 'favorited' : ''}" onclick="toggleFav(event, '${ch.name}')" title="Favorite">
            <i data-lucide="star" style="width:15px;height:15px;fill:${isFav ? '#FFD60A' : 'none'}"></i>
          </button>
        `;
        channelListEl.appendChild(item);
      });

      lucide.createIcons();
    }

    async function loadChannel(index) {
      if (index < 0 || index >= CHANNELS.length) return;
      currentIndex = index;
      const ch = CHANNELS[index];

      renderChannels();

      // Update Top Header
      document.getElementById('activeChannelName').textContent = ch.name;
      document.getElementById('streamStatusText').textContent = useCloudflareProxy ? 'Cloudflare HTTPS Tunnel' : 'Direct ZTE Stream';
      const headerLogo = document.getElementById('headerLogo');
      headerLogo.innerHTML = `
        <img src="logos/${ch.logo}" alt="${ch.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
        <span class="ch-fallback" style="display:none;">${getInitials(ch.name)}</span>
      `;

      // Show Loading Overlay
      showStatus('Connecting to ' + ch.name + '...', 'Negotiating MPEG-DASH manifest and initializing media buffers.', true);

      try {
        // Configure ClearKey DRM if provided
        if (ch.key && ch.key.includes(':')) {
          const [keyId, keyVal] = ch.key.split(':');
          shakaPlayer.configure({ drm: { clearKeys: { [keyId.trim()]: keyVal.trim() } } });
        } else {
          shakaPlayer.configure({ drm: { clearKeys: {} } });
        }

        const manifestUrl = useCloudflareProxy
          ? `${window.location.origin}/proxy?url=${encodeURIComponent(ch.url)}`
          : ch.url;

        await shakaPlayer.load(manifestUrl);
        videoEl.play().catch(() => {});
        hideStatus();
      } catch (err) {
        handleStreamFailure(err);
      }
    }

    function handleStreamFailure(err) {
      console.error('Stream Error:', err);
      const isHttps = window.location.protocol === 'https:';
      let msg = 'The remote IPTV server did not respond or require a Philippines ISP connection / active ZTE session token.';
      if (isHttps && !useCloudflareProxy) {
        msg = 'Browser blocked raw HTTP stream on an HTTPS page (Mixed Content). Enable Cloudflare Proxy Mode or allow Insecure Content in Site Settings.';
      }
      showStatus('Unable to Play Stream', msg, false);
    }

    function onPlayerError(event) {
      handleStreamFailure(event.detail);
    }

    function showStatus(title, desc, isLoading) {
      statusOverlay.classList.remove('hidden');
      statusTitle.textContent = title;
      statusDesc.textContent = desc;
      statusSpinner.style.display = isLoading ? 'block' : 'none';
      errorActions.style.display = isLoading ? 'none' : 'flex';
    }

    function hideStatus() {
      statusOverlay.classList.add('hidden');
    }

    function toggleProxyMode() {
      useCloudflareProxy = !useCloudflareProxy;
      updateProxyUI();
      reloadCurrentChannel();
    }

    function switchToProxyAndRetry() {
      useCloudflareProxy = true;
      updateProxyUI();
      reloadCurrentChannel();
    }

    function updateProxyUI() {
      const btn = document.getElementById('proxyToggleBtn');
      const label = document.getElementById('proxyModeLabel');
      if (useCloudflareProxy) {
        btn.classList.add('active-mode');
        label.textContent = 'Mode: CF Proxy';
      } else {
        btn.classList.remove('active-mode');
        label.textContent = 'Mode: Direct';
      }
    }

    function reloadCurrentChannel() {
      loadChannel(currentIndex);
    }

    function stepChannel(direction) {
      const next = (currentIndex + direction + CHANNELS.length) % CHANNELS.length;
      loadChannel(next);
    }

    function toggleFav(e, name) {
      e.stopPropagation();
      if (favorites.includes(name)) {
        favorites = favorites.filter(f => f !== name);
      } else {
        favorites.push(name);
      }
      localStorage.setItem('visiontv_favs', JSON.stringify(favorites));
      renderChannels();
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.getElementById('tabAll').classList.toggle('active', filter === 'all');
      document.getElementById('tabFav').classList.toggle('active', filter === 'fav');
      renderChannels();
    }

    function togglePlay() {
      if (videoEl.paused) {
        videoEl.play();
      } else {
        videoEl.pause();
      }
    }

    videoEl.addEventListener('play', () => {
      document.getElementById('playPauseBtn').innerHTML = '<i data-lucide="pause" style="width:18px;height:18px;"></i>';
      lucide.createIcons();
    });

    videoEl.addEventListener('pause', () => {
      document.getElementById('playPauseBtn').innerHTML = '<i data-lucide="play" style="width:18px;height:18px;"></i>';
      lucide.createIcons();
    });

    function toggleMute() {
      videoEl.muted = !videoEl.muted;
      document.getElementById('muteBtn').innerHTML = `<i data-lucide="${videoEl.muted ? 'volume-x' : 'volume-2'}" style="width:18px;height:18px;"></i>`;
      lucide.createIcons();
    }

    function changeVolume(val) {
      videoEl.volume = parseFloat(val);
      videoEl.muted = val === '0';
    }

    async function togglePiP() {
      if (document.pictureInPictureElement) {
        await document.exitPictureInPicture();
      } else if (videoEl.requestPictureInPicture) {
        await videoEl.requestPictureInPicture();
      }
    }

    function toggleFullscreen() {
      const win = document.getElementById('macWindow');
      if (!document.fullscreenElement) {
        win.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }

    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      sb.style.display = sb.style.display === 'none' ? 'flex' : 'none';
    }

    function copyStreamUrl() {
      const ch = CHANNELS[currentIndex];
      navigator.clipboard.writeText(ch.url);
      const statusText = document.getElementById('streamStatusText');
      const prev = statusText.textContent;
      statusText.textContent = 'Copied MPD URL to clipboard!';
      setTimeout(() => { statusText.textContent = prev; }, 2000);
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString([], {
        weekday: 'short',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (document.activeElement === searchInput) return;
      if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
      if (e.code === 'ArrowUp') { e.preventDefault(); stepChannel(-1); }
      if (e.code === 'ArrowDown') { e.preventDefault(); stepChannel(1); }
      if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); }
      if (e.key === 'm' || e.key === 'M') { toggleMute(); }
    });
  </script>
</body>
</html>
